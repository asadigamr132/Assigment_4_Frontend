    <h4>Bootstrap Form</h4>

    <div class="container mt-4">
        <form>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" class="form-control is-valid" id="name" name="name" required placeholder="Enter your name">
                <div class="valid-feedback">Looks good!</div> 
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control is-invalid" id="email" name="email" required placeholder="Enter your email">
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                    <div class="form-text">We will never share your email with anyone else.</div>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea class="form-control is-invalid" id="message" name="message" rows="4" required></textarea>
                <div class="invalid-feedback">Please enter your message.</div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        </div>
